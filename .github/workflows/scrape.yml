name: Zbieranie ofert

on:
  schedule:
    - cron: "13 5,13 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Tryb"
        type: choice
        options: [run, init, dry-run, migrate, report, add, delete-backup]
        default: run
      backup:
        description: "Nazwa kopii zapasowej do usunięcia (tryb delete-backup)"
        type: string
        default: ""
      url:
        description: "Link do oferty (tryb add)"
        type: string
        default: ""
      text:
        description: "Wklejony opis oferty (tryb add, opcjonalnie)"
        type: string
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKUP_NAME: ${{ inputs.backup }}
          ADD_URL: ${{ inputs.url }}
          ADD_TEXT: ${{ inputs.text }}
        run: |
          case "${{ inputs.mode || 'run' }}" in
            init)    python main.py --init ;;
            migrate) python main.py --migrate ;;
            report)  python main.py --report ;;
            add)     python main.py --add --url "$ADD_URL" --text "$ADD_TEXT" ;;
            delete-backup) python main.py --delete-backup "$BACKUP_NAME" ;;
            dry-run) python main.py --dry-run --runner cloud ;;
            *)       python main.py --runner cloud ;;
          esac
