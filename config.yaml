# Co zbierać. Zmieniasz tutaj, nie w kodzie.

filters:
  # tytuł przechodzi, jeśli zawiera coś z title_require_any
  # ALBO (coś z title_mobile_words I coś z title_dev_words)
  title_require_any: ["android", "kotlin"]
  title_mobile_words: ["mobile"]
  title_dev_words: ["developer", "engineer", "programista", "inżynier", "dev"]
  # odrzuć, jeśli tytuł zawiera którekolwiek z tych słów (całe słowa, nie fragmenty)
  title_exclude: ["junior", "intern", "internship", "staż", "stażysta", "trainee", "ios developer", "react native",
                  "qa", "tester", "test engineer", "react", "electron", "angular", "frontend", "backend", "devops",
                  "test automation", "automation", "product", "designer", "ux", "ui/ux", "owner", "manager",
                  "marketing", "sales"]
  remote_only: true
  # minimalne widełki "do" w PLN / miesiąc (B2B lub UoP); 0 = nie filtruj
  # oferty bez widełek przechodzą (flaga "brak widełek" w kolumnie Widełki)
  min_salary_to_pln: 18000
  # odrzuć oferty z matchem poniżej progu (0-1); 0 = nie filtruj
  min_match: 0.4

sources:
  justjoinit: true
  nofluffjobs: true

dedup:
  # podobieństwo tytułów (0-100) przy tej samej firmie, od którego uznajemy duplikat
  fuzzy_title_threshold: 90

sheet:
  tab_offers: "Oferty"
  tab_skills: "Słownik"
  followup_days: 7
  soon_days: 2

notify:
  # Telegram: ustaw sekrety TELEGRAM_TOKEN i TELEGRAM_CHAT_ID, inaczej pomija
  telegram: true
  min_match_to_notify: 0.6

# przeliczanie walut na PLN (orientacyjnie, do filtra widełek)
fx_to_pln: {PLN: 1, EUR: 4.3, USD: 4.0, GBP: 5.0, CHF: 4.5}
