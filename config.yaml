# Co zbierać. Zmieniasz tutaj, nie w kodzie.

filters:
  # tytuł przechodzi, jeśli zawiera coś z title_require_any
  # ALBO (coś z title_mobile_words I coś z title_dev_words)
  title_require_any: ["android", "kotlin"]
  title_mobile_words: ["mobile"]
  title_dev_words: ["developer", "engineer", "programista", "inżynier", "dev"]
  # odrzuć, jeśli tytuł zawiera którekolwiek z tych słów (całe słowa, nie fragmenty)
  title_exclude: ["junior", "intern", "internship", "staż", "stażysta", "trainee", "ios developer", "react native",
                  "qa", "tester", "test engineer", "react", "electron", "angular", "frontend", "backend", "devops",
                  "test automation", "automation", "product", "designer", "ux", "ui/ux", "owner", "manager",
                  "marketing", "sales",
                  # role liderskie i architektoniczne: celujemy w Mid / Senior, nie w lidera
                  "lead", "tech lead", "team lead", "leader", "lider", "staff", "principal", "architect",
                  "head", "director", "kierownik"]
  remote_only: true
  # dozwolone formy współpracy (kody z contracts.py); oferta bez podanej formy przechodzi
  contract_allow: ["B2B", "UoP", "UZ", "UoD"]
  # minimalne widełki "do" w PLN / miesiąc (B2B lub UoP); 0 = nie filtruj
  # oferty bez widełek przechodzą (flaga "brak widełek" w kolumnie Widełki)
  min_salary_to_pln: 18000
  # odrzuć oferty z matchem poniżej progu (0-1); 0 = nie filtruj
  min_match: 0.4

# true/false albo {enabled: true, runner: cloud|local}. runner decyduje, który workflow zbiera źródło:
#   cloud = GitHub Actions (scrape.yml), local = self-hosted runner na Macu (scrape-local.yml).
# Samo true/false oznacza runner "cloud". czyjesteldorado.pl blokuje IP serwerowni (403), więc działa lokalnie.
sources:
  justjoinit: true
  nofluffjobs: true
  czyjesteldorado: {enabled: true, runner: local}
  bulldogjob: true
  solidjobs: true

dedup:
  # tytuły (0-100): pewny duplikat przy tej samej firmie / możliwy duplikat przy tej samej firmie / minimum dla porównania treści
  title_sure: 90
  title_possible: 75
  title_content: 70
  # podobieństwo treści (Jaccard 0-1): pewny duplikat / możliwy duplikat
  content_sure: 0.90
  content_possible: 0.60
  # zgodność nazw firm po normalizacji (rapidfuzz ratio)
  company_ratio: 92

# ocena poziomu stanowiska (kolumna Poziom, moduł level.py); wpisy na wierszach, którym brak sygnałów, dostają "?"
level:
  # wymagane lata doświadczenia: do years_mid_max = Mid, do years_senior_max = Senior, więcej = Senior+
  years_mid_max: 4
  years_senior_max: 7
  # sygnały podbijające Senior -> Senior+: etykieta (trafia do Notatek) -> lista regexów.
  # Regexy działają na tekście znormalizowanym: małe litery, bez polskich ogonków i bez interpunkcji
  # (np. "live-coding" to "live coding", "przywództwo" to "przywodztwo").
  bump_signals:
    "mentoring / prowadzenie zespołu":
      - 'mentor(?:ing|ship)? (?:of |for )?(?:junior|juniors|other|others|less|team|engineers|developers|mlodszych|zespol)'
      - '(?:act|acting|serve|serving|being|be) as (?:a )?mentor'
      - 'mentoruj\w*|mentorowa\w* (?:mlodszych|zespol|junior)'
      - 'lead(?:ing)? (?:a |the |our |small )?(?:small )?(?:team|squad|engineers|developers)'
      - 'prowadzeni\w* zespol\w*|kierowani\w* zespol\w*'
    "ownership of architecture":
      - '(?:own|owns|owning|ownership of|ownership over) (?:the |our )?(?:\w+ )?architecture'
      - 'architecture ownership'
      - 'odpowiedzialn\w* za architektur\w*'
      - '(?:define|defining|set|setting) (?:the |our )?(?:\w+ )?architecture'
    "technical leadership":
      - 'technical leadership|tech leadership|technical lead(?:er)?\b'
      - 'przywodztw\w* technicz\w*|lider\w* technicz\w*|techniczn\w* lider\w*'
    "system design":
      - 'system design|systems design|projektowani\w* system\w*'
    "live coding":
      - 'live coding|kodowani\w* na zywo'
    "algorytmy / LeetCode":
      - 'leetcode|algorithmic|algorytmiczn\w*'
    "zadanie domowe":
      - 'take home|home assignment|zadani\w* domow\w*|zadani\w* rekrutacyjn\w*'
    "4+ etapy rekrutacji":
      - '(?:[4-9]|four|five|six|cztery|piec|szesc) (?:stage|stages|step|steps|round|rounds|interview|interviews|etap\w*|rozmow\w*)'

# oferty związane z AI (kolumna AI, moduł ai_flag.py). Wpisy to regexy na tekście znormalizowanym
# (małe litery, bez ogonków i interpunkcji), dopasowywane jako całe słowa z opcjonalnym "s" na końcu.
ai:
  # AI jako produkt / domena pracy
  produkt: ["llm", "gpt", "openai", "anthropic", "claude", "gemini", "genai", "generative ai", "chatbot",
            "ai assistant", "rag", "machine learning", "uczenie maszynowe", "ml kit", "tensorflow lite", "tflite",
            "litert", "mediapipe", "on device ml", "computer vision", "sztuczna inteligencja",
            "artificial intelligence", "ai"]
  # AI w codziennej pracy programisty
  workflow: ["copilot", "cursor", "claude code", "ai tools", "ai assisted", "agentic",
             "(?:ai|coding|software development|sdlc) agent", "agent\\w* (?:for|in) (?:software|development|sdlc)",
             "prompt engineering"]

sheet:
  tab_offers: "Oferty"
  tab_skills: "Słownik"
  tab_descriptions: "_opisy"
  tab_sources: "Źródła"

notify:
  # Telegram: ustaw sekrety TELEGRAM_TOKEN i TELEGRAM_CHAT_ID, inaczej pomija
  telegram: true
  min_match_to_notify: 0.6

# przeliczanie walut na PLN (orientacyjnie, do filtra widełek)
fx_to_pln: {PLN: 1, EUR: 4.3, USD: 4.0, GBP: 5.0, CHF: 4.5}
